name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:github-pages

      - name: Prepare Pages artifact
        run: |
          mkdir -p site
          if [ -d dist/github-pages ]; then
            cp -R dist/github-pages/. site
          else
            echo "No build output folder found" >&2
            exit 1
          fi
          if [ -f site/github-pages.html ] && [ ! -f site/index.html ]; then
            mv site/github-pages.html site/index.html
          fi
          if [ ! -f site/index.html ]; then
            echo "No index.html found in Pages artifact" >&2
            find site -maxdepth 3 -type f | sort
            exit 1
          fi
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4